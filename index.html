<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biology Objective Quiz</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eef3f8;
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    color:#222;
}

.quiz-box{
    max-width:850px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#075b9a;
    margin-top:0;
    font-size:28px;
}

.subtitle{
    text-align:center;
    font-size:18px;
    margin-bottom:25px;
    color:#555;
}

.question{
    margin-bottom:25px;
    padding:18px;
    border:1px solid #d5dce3;
    border-radius:12px;
    background:#fafcff;
}

.question-text{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
    line-height:1.6;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    margin:9px 0;
    padding:13px 15px;
    border:2px solid #d8dee5;
    border-radius:9px;
    background:white;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

.option:hover{
    background:#eef7ff;
    border-color:#1683c7;
}

.option.correct{
    background:#d9f5df;
    border-color:#20a13a;
    color:#126b25;
    font-weight:bold;
}

.option.wrong{
    background:#ffe0e0;
    border-color:#e33434;
    color:#a40000;
    font-weight:bold;
}

.result{
    margin-top:10px;
    font-size:17px;
    font-weight:bold;
}

#scoreBox{
    display:none;
    margin-top:25px;
    padding:20px;
    text-align:center;
    border-radius:12px;
    background:#e5f3ff;
    border:2px solid #1683c7;
}

#score{
    font-size:25px;
    font-weight:bold;
    color:#075b9a;
}

button#reset{
    margin-top:15px;
    padding:11px 25px;
    border:none;
    border-radius:8px;
    background:#075b9a;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button#reset:hover{
    background:#064673;
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .quiz-box{
        padding:15px;
    }

    h1{
        font-size:23px;
    }

    .question-text{
        font-size:18px;
    }

    .option{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="quiz-box">

    <h1>CLASS 10th BIOLOGY</h1>

    <div class="subtitle">
        वस्तुनिष्ठ प्रश्न — Quiz
    </div>

    <!-- प्रश्न 1 -->
    <div class="question" data-answer="A">

        <div class="question-text">
            1. प्रकाश संश्लेषण क्रिया में ऑक्सीजन बाहर निकलता है—
        </div>

        <button class="option" onclick="checkAnswer(this,'A')">
            (A) जल से
        </button>

        <button class="option" onclick="checkAnswer(this,'B')">
            (B) CO₂ से
        </button>

        <button class="option" onclick="checkAnswer(this,'C')">
            (C) ग्लूकोज से
        </button>

        <button class="option" onclick="checkAnswer(this,'D')">
            (D) डिक्टियोसोम से
        </button>

        <div class="result"></div>

    </div>


    <!-- प्रश्न 2 -->
    <div class="question" data-answer="B">

        <div class="question-text">
            2. ग्वाइटर अथवा घेंघा पनपता है।
        </div>

        <button class="option" onclick="checkAnswer(this,'A')">
            (A) चीनी की कमी से
        </button>

        <button class="option" onclick="checkAnswer(this,'B')">
            (B) आयोडीन की कमी से
        </button>

        <button class="option" onclick="checkAnswer(this,'C')">
            (C) रक्त की कमी से
        </button>

        <button class="option" onclick="checkAnswer(this,'D')">
            (D) मोटापा से
        </button>

        <div class="result"></div>

    </div>


    <!-- प्रश्न 3 -->
    <div class="question" data-answer="C">

        <div class="question-text">
            3. कूटपाद किसमें पाया जाता है?
        </div>

        <button class="option" onclick="checkAnswer(this,'A')">
            (A) पैरामीशियम
        </button>

        <button class="option" onclick="checkAnswer(this,'B')">
            (B) यूग्लीना
        </button>

        <button class="option" onclick="checkAnswer(this,'C')">
            (C) अमीबा
        </button>

        <button class="option" onclick="checkAnswer(this,'D')">
            (D) इनमें से कोई नहीं
        </button>

        <div class="result"></div>

    </div>


    <div id="scoreBox">
        <div>🎉 Quiz समाप्त!</div>
        <div id="score"></div>

        <button id="reset" onclick="resetQuiz()">
            फिर से Quiz दें
        </button>
    </div>

</div>


<script>

let score = 0;
let attempted = 0;

function checkAnswer(button, selected){

    let question = button.parentElement;
    let correctAnswer = question.getAttribute("data-answer");
    let options = question.querySelectorAll(".option");
    let result = question.querySelector(".result");

    /* एक प्रश्न का उत्तर दोबारा न चुना जा सके */
    if(question.classList.contains("answered")){
        return;
    }

    question.classList.add("answered");
    attempted++;

    /* सभी विकल्प बंद */
    options.forEach(function(option){
        option.disabled = true;
    });

    if(selected === correctAnswer){

        button.classList.add("correct");

        result.innerHTML =
            "✓ सही उत्तर!";

        result.style.color = "#16852b";

        score++;

    }else{

        button.classList.add("wrong");

        result.innerHTML =
            "✗ गलत उत्तर! सही उत्तर है: (" + correctAnswer + ")";

        result.style.color = "#c00000";

        /* सही उत्तर को हाइलाइट करें */
        options.forEach(function(option){

            let onclickText = option.getAttribute("onclick");

            if(onclickText.includes("'" + correctAnswer + "'")){
                option.classList.add("correct");
            }

        });
    }

    /* सभी प्रश्न हल होने पर स्कोर दिखाएँ */
    if(attempted === 3){

        document.getElementById("scoreBox").style.display = "block";

        document.getElementById("score").innerHTML =
            "आपका स्कोर: " + score + " / 3";

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    }
}


function resetQuiz(){

    score = 0;
    attempted = 0;

    let questions = document.querySelectorAll(".question");

    questions.forEach(function(question){

        question.classList.remove("answered");

        let options = question.querySelectorAll(".option");

        options.forEach(function(option){

            option.disabled = false;

            option.classList.remove("correct");
            option.classList.remove("wrong");

        });

        question.querySelector(".result").innerHTML = "";

    });

    document.getElementById("scoreBox").style.display = "none";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

</script>

</body>
      </html>
