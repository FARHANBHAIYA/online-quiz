<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FARHAN BHAIYA - CLASS XTH BIOLOGY</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:linear-gradient(135deg,#e8f5e9,#e3f2fd);
    color:#222;
}

.header{
    background:linear-gradient(135deg,#1565c0,#00897b);
    color:white;
    text-align:center;
    padding:20px 10px;
    border-radius:0 0 25px 25px;
    box-shadow:0 4px 12px #0003;
}

.header h1{
    margin:0;
    font-size:28px;
    font-weight:bold;
}

.header h2{
    margin:7px 0;
    font-size:22px;
}

.header p{
    margin:5px 0 0;
    font-size:18px;
    font-weight:bold;
}

.quiz{
    max-width:650px;
    margin:20px auto;
    padding:12px;
}

.question{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 20px #0002;
}

#qno{
    color:#1565c0;
    margin-top:0;
}

#question{
    font-size:20px;
    line-height:1.5;
}

.options{
    margin-top:20px;
}

.options button{
    display:block;
    width:100%;
    margin:12px 0;
    padding:15px;
    border:2px solid #ddd;
    border-radius:13px;
    background:#fff;
    font-size:17px;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.options button:hover{
    background:#f5f5f5;
}

.options button:active{
    transform:scale(.98);
}

.options button.correct{
    background:#c8e6c9 !important;
    border-color:#2e7d32 !important;
    color:#1b5e20;
    font-weight:bold;
}

.options button.wrong{
    background:#ffcdd2 !important;
    border-color:#c62828 !important;
    color:#b71c1c;
    font-weight:bold;
}

.answer{
    text-align:center;
    font-size:19px;
    font-weight:bold;
    margin-top:18px;
    min-height:28px;
}

.next{
    display:block;
    margin:18px auto 0;
    padding:13px 30px;
    border:0;
    border-radius:13px;
    background:#1565c0;
    color:white;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 3px 8px #0003;
}

.next:active{
    transform:scale(.96);
}

#result{
    display:none;
    background:white;
    margin-top:20px;
    padding:25px 15px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px #0002;
}

#result h2{
    color:#1565c0;
}

#score,
#percent{
    font-size:20px;
}

.restart{
    background:#00897b;
    color:white;
    border:0;
    padding:13px 28px;
    border-radius:12px;
    font-size:17px;
    margin-top:10px;
}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>FARHAN BHAIYA</h1>

    <h2>CLASS XTH BIOLOGY</h2>

    <p>CHAP-01 जैव प्रक्रम</p>

</div>



<!-- QUIZ -->

<div class="quiz">

    <div class="question">

        <h3 id="qno"></h3>

        <h2 id="question"></h2>

        <div class="options" id="options"></div>

        <div class="answer" id="answer"></div>

        <button
            class="next"
            id="nextBtn"
            onclick="nextQuestion()"
            style="display:none;">
            अगला प्रश्न ➜
        </button>

    </div>



    <!-- RESULT -->

    <div id="result">

        <h2>🎉 Quiz पूरा हुआ!</h2>

        <p id="score"></p>

        <p id="percent"></p>

        <button
            class="restart"
            onclick="restartQuiz()">
            🔄 फिर से शुरू करें
        </button>

    </div>

</div>



<script>


/* =========================
   QUESTIONS
========================= */

const questions = [

{
q:"पौधों में वाष्पोत्सर्जन किस भाग में होता है?",
options:[
"जड़",
"तना",
"पत्ता",
"फूल"
],
answer:2
},

{
q:"प्रकाश संश्लेषण के लिए पौधों को किस गैस की आवश्यकता होती है?",
options:[
"ऑक्सीजन",
"कार्बन डाइऑक्साइड",
"नाइट्रोजन",
"हाइड्रोजन"
],
answer:1
},

{
q:"मानव में भोजन का पाचन मुख्यतः कहाँ होता है?",
options:[
"मुख",
"ग्रसनी",
"छोटी आंत",
"बड़ी आंत"
],
answer:2
},

{
q:"रक्त में ऑक्सीजन का परिवहन किसके द्वारा होता है?",
options:[
"प्लेटलेट्स",
"हीमोग्लोबिन",
"प्लाज्मा",
"WBC"
],
answer:1
},

{
q:"पौधों में जल का परिवहन किस ऊतक द्वारा होता है?",
options:[
"फ्लोएम",
"जाइलम",
"मेरिस्टेम",
"पैरेन्काइमा"
],
answer:1
},

{
q:"भोजन का परिवहन पौधों में किसके द्वारा होता है?",
options:[
"जाइलम",
"फ्लोएम",
"रंध्र",
"जड़"
],
answer:1
},

{
q:"मानव शरीर में श्वसन का मुख्य अंग कौन-सा है?",
options:[
"हृदय",
"फेफड़े",
"गुर्दे",
"यकृत"
],
answer:1
},

{
q:"ग्लूकोज के टूटने से मुख्यतः क्या प्राप्त होता है?",
options:[
"ऊर्जा",
"पानी",
"ऑक्सीजन",
"नाइट्रोजन"
],
answer:0
},

{
q:"मानव शरीर में रक्त का पम्पिंग कौन करता है?",
options:[
"फेफड़ा",
"हृदय",
"यकृत",
"गुर्दा"
],
answer:1
},

{
q:"वाष्पोत्सर्जन मुख्यतः पौधे के किस भाग से होता है?",
options:[
"जड़",
"फूल",
"रंध्र",
"फल"
],
answer:2
}

];



/* =========================
   QUIZ VARIABLES
========================= */

let current = 0;

let score = 0;

let answered = false;



/* =========================
   CORRECT SOUND
   NO VIBRATION
========================= */

function tickSound(){

    try{

        const audio =
        new (window.AudioContext ||
        window.webkitAudioContext)();

        const osc =
        audio.createOscillator();

        const gain =
        audio.createGain();


        osc.type = "sine";


        osc.frequency.setValueAtTime(
            1100,
            audio.currentTime
        );


        osc.frequency.exponentialRampToValueAtTime(
            1600,
            audio.currentTime + 0.08
        );


        gain.gain.setValueAtTime(
            0.001,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.20,
            audio.currentTime + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + 0.16
        );


        osc.connect(gain);

        gain.connect(audio.destination);


        osc.start();

        osc.stop(
            audio.currentTime + 0.16
        );

    }catch(e){

        console.log("Sound error:",e);

    }

}



/* =========================
   WRONG SOUND
   + LIGHT VIBRATION
========================= */

function wrongSound(){

    try{

        const audio =
        new (window.AudioContext ||
        window.webkitAudioContext)();


        const osc =
        audio.createOscillator();

        const gain =
        audio.createGain();


        osc.type = "sine";


        osc.frequency.setValueAtTime(
            280,
            audio.currentTime
        );


        osc.frequency.exponentialRampToValueAtTime(
            180,
            audio.currentTime + 0.18
        );


        gain.gain.setValueAtTime(
            0.001,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.18,
            audio.currentTime + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + 0.20
        );


        osc.connect(gain);

        gain.connect(audio.destination);


        osc.start();

        osc.stop(
            audio.currentTime + 0.20
        );


    }catch(e){

        console.log("Sound error:",e);

    }


    /* LIGHT VIBRATION */

    if("vibrate" in navigator){

        navigator.vibrate(70);

    }

}



/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

    answered = false;


    document.getElementById("qno").innerText =
        "प्रश्न " +
        (current + 1) +
        " / " +
        questions.length;


    document.getElementById("question").innerText =
        questions[current].q;


    document.getElementById("answer").innerText =
        "";


    document.getElementById("nextBtn").style.display =
        "none";


    const box =
        document.getElementById("options");


    box.innerHTML = "";


    questions[current].options.forEach(
        (option,index)=>{

            const button =
                document.createElement("button");


            button.innerText =
                String.fromCharCode(65 + index)
                + ". "
                + option;


            button.onclick =
                function(){

                    checkAnswer(
                        index,
                        button
                    );

                };


            box.appendChild(button);

        }
    );

}



/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
    selected,
    button
){

    if(answered){

        return;

    }


    answered = true;


    const correct =
        questions[current].answer;



    /* CORRECT */

    if(selected === correct){

        score++;


        button.classList.add(
            "correct"
        );


        document.getElementById(
            "answer"
        ).innerText =
            "✓ सही उत्तर!";


        tickSound();

    }



    /* WRONG */

    else{

        button.classList.add(
            "wrong"
        );


        document.getElementById(
            "answer"
        ).innerText =
            "✗ गलत उत्तर!";


        wrongSound();


        const allButtons =
            document.querySelectorAll(
                ".options button"
            );


        allButtons[correct]
            .classList.add(
                "correct"
            );

    }



    /* SHOW NEXT BUTTON */

    document.getElementById(
        "nextBtn"
    ).style.display =
        "block";

}



/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

    current++;


    if(current < questions.length){

        loadQuestion();

    }

    else{

        document.querySelector(
            ".question"
        ).style.display =
            "none";


        document.getElementById(
            "result"
        ).style.display =
            "block";


        document.getElementById(
            "score"
        ).innerText =
            "आपका स्कोर: "
            + score
            + " / "
            + questions.length;


        const percentage =
            (score /
            questions.length) * 100;


        document.getElementById(
            "percent"
        ).innerText =
            "प्रतिशत: "
            + percentage
            + "%";

    }

}



/* =========================
   RESTART QUIZ
========================= */

function restartQuiz(){

    current = 0;

    score = 0;

    answered = false;


    document.getElementById(
        "result"
    ).style.display =
        "none";


    document.querySelector(
        ".question"
    ).style.display =
        "block";


    loadQuestion();

}



/* =========================
   START QUIZ
========================= */

loadQuestion();

</script>

</body>
    </html>
