<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FARHAN BHAIYA - Biology Quiz</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    background:linear-gradient(135deg,#eaf4ff,#f8fbff);
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    color:#222;
    overflow-x:hidden;
}

.quiz-box{
    max-width:850px;
    margin:auto;
    background:#fff;
    padding:22px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

/* HEADING */

.main-heading{
    text-align:center;
    margin-bottom:22px;
}

.farhan{
    font-family:Arial,sans-serif;
    font-size:34px;
    font-weight:900;
    letter-spacing:2px;
    color:#075b9a;
    text-shadow:1px 2px 3px rgba(0,0,0,.2);
}

.biology{
    margin-top:6px;
    font-size:28px;
    font-weight:900;
    color:#16852b;
}

.chapter{
    margin-top:2px;
    font-size:22px;
    font-weight:bold;
    color:#333;
}

.objective{
    display:inline-block;
    margin-top:10px;
    padding:7px 18px;
    border-radius:20px;
    background:#075b9a;
    color:#fff;
    font-size:18px;
    font-weight:bold;
}

/* QUESTION */

.question{
    margin-top:20px;
    padding:18px;
    border:2px solid #dce5ee;
    border-radius:14px;
    background:#fbfdff;
}

.question-text{
    font-size:20px;
    font-weight:bold;
    line-height:1.65;
    margin-bottom:14px;
}

/* OPTIONS */

.option{
    position:relative;
    display:flex;
    align-items:center;
    width:100%;
    min-height:54px;
    margin:10px 0;
    padding:11px 52px 11px 15px;
    border:2px solid #d7dfe7;
    border-radius:11px;
    background:#fff;
    font-size:18px;
    text-align:left;
    cursor:pointer;
    transition:.25s;
}

.option:hover:not(:disabled){
    background:#eef8ff;
    border-color:#1683c7;
    transform:translateX(2px);
}

.option:disabled{
    cursor:default;
}

/* CORRECT */

.option.correct{
    background:#c9f5d2 !important;
    border-color:#159c38 !important;
    color:#075b1d;
    font-weight:bold;
}

/* WRONG */

.option.wrong{
    background:#ffd1d1 !important;
    border-color:#e00000 !important;
    color:#a00000;
    font-weight:bold;
}

/* MARK */

.mark{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    width:29px;
    height:29px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    font-size:19px;
    font-weight:bold;
}

.option.correct .mark{
    display:flex;
    background:#1267d6;
    color:#fff;
}

.option.wrong .mark{
    display:flex;
    background:#e00000;
    color:#fff;
}

/* SUBMIT */

#submitBtn{
    display:block;
    width:100%;
    margin:28px auto 10px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#075b9a,#1683c7);
    color:#fff;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

#submitBtn:hover{
    transform:scale(1.01);
}

#submitBtn:disabled{
    background:#777;
    cursor:not-allowed;
}

/* RESULT */

#resultArea{
    display:none;
    margin-top:25px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.result-card{
    padding:18px;
    border-radius:13px;
    text-align:center;
    font-size:19px;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(0,0,0,.12);
}

.correct-box{
    background:#d8f8df;
    border:2px solid #20a13a;
    color:#087522;
}

.wrong-box{
    background:#ffdede;
    border:2px solid #e33434;
    color:#b00000;
}

.score-box{
    background:#dceeff;
    border:2px solid #1683c7;
    color:#075b9a;
}

.percent-box{
    background:#fff0c9;
    border:2px solid #e0a500;
    color:#956d00;
}

.big-number{
    display:block;
    font-size:30px;
    margin-top:5px;
}

/* FINAL MESSAGE */

#finalMessage{
    margin-top:18px;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

/* RESET */

#resetBtn{
    display:block;
    margin:20px auto 0;
    padding:12px 25px;
    border:none;
    border-radius:9px;
    background:#333;
    color:#fff;
    font-size:17px;
    cursor:pointer;
}

/* FLOWERS */

.flower{
    position:fixed;
    top:-60px;
    z-index:99999;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    0%{
        transform:translateY(-60px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:7px;
    }

    .quiz-box{
        padding:14px;
    }

    .farhan{
        font-size:28px;
    }

    .biology{
        font-size:24px;
    }

    .chapter{
        font-size:19px;
    }

    .objective{
        font-size:16px;
    }

    .question-text{
        font-size:18px;
    }

    .option{
        font-size:16px;
        min-height:51px;
    }

    .result-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="quiz-box">

    <!-- ================= HEADER ================= -->

    <div class="main-heading">

        <div class="farhan">
            FARHAN BHAIYA
        </div>

        <div class="biology">
            BIOLOGY
        </div>

        <div class="chapter">
            जैव प्रक्रम
        </div>

        <div class="objective">
            QUESTION BANK — OBJECTIVE
        </div>

    </div>


    <!-- ================= QUESTION 1 ================= -->

    <div class="question" data-answer="A">

        <div class="question-text">
            1. प्रकाश संश्लेषण क्रिया में ऑक्सीजन बाहर निकलता है—
        </div>

        <button class="option" onclick="checkAnswer(this,'A')">
            (A) जल से
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'B')">
            (B) CO₂ से
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'C')">
            (C) ग्लूकोज से
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'D')">
            (D) डिक्टियोसोम से
            <span class="mark">✓</span>
        </button>

    </div>


    <!-- ================= QUESTION 2 ================= -->

    <div class="question" data-answer="B">

        <div class="question-text">
            2. ग्वाइटर अथवा घेंघा पनपता है।
        </div>

        <button class="option" onclick="checkAnswer(this,'A')">
            (A) चीनी की कमी से
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'B')">
            (B) आयोडीन की कमी से
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'C')">
            (C) रक्त की कमी से
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'D')">
            (D) मोटापा से
            <span class="mark">✓</span>
        </button>

    </div>


    <!-- ================= QUESTION 3 ================= -->

    <div class="question" data-answer="C">

        <div class="question-text">
            3. कूटपाद किसमें पाया जाता है?
        </div>

        <button class="option" onclick="checkAnswer(this,'A')">
            (A) पैरामीशियम
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'B')">
            (B) यूग्लीना
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'C')">
            (C) अमीबा
            <span class="mark">✓</span>
        </button>

        <button class="option" onclick="checkAnswer(this,'D')">
            (D) इनमें से कोई नहीं
            <span class="mark">✓</span>
        </button>

    </div>


    <!-- ================= SUBMIT ================= -->

    <button id="submitBtn" onclick="submitQuiz()">
        SUBMIT QUIZ
    </button>


    <!-- ================= RESULT ================= -->

    <div id="resultArea">

        <div class="result-grid">

            <div class="result-card correct-box">
                ✓ सही उत्तर
                <span class="big-number" id="correctCount">0</span>
            </div>

            <div class="result-card wrong-box">
                ✕ गलत उत्तर
                <span class="big-number" id="wrongCount">0</span>
            </div>

            <div class="result-card score-box">
                🏆 SCORE
                <span class="big-number" id="scoreCount">
                    0 / 3
                </span>
            </div>

            <div class="result-card percent-box">
                📊 PERCENTAGE
                <span class="big-number" id="percentage">
                    0%
                </span>
            </div>

        </div>

        <div id="finalMessage"></div>

        <button id="resetBtn" onclick="resetQuiz()">
            🔄 फिर से Quiz दें
        </button>

    </div>

</div>


<script>

/* ==================================================
   QUIZ VARIABLES
================================================== */

let score = 0;
let attempted = 0;
let submitted = false;


/* ==================================================
   CORRECT SOUND
================================================== */

function playCorrectSound(){

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx = new AudioContext();

    const notes = [
        523,
        659,
        784,
        1046
    ];

    notes.forEach(function(freq,index){

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;

        osc.connect(gain);
        gain.connect(ctx.destination);

        const start =
            ctx.currentTime + index * 0.09;

        gain.gain.setValueAtTime(
            0.001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            0.3,
            start + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            start + 0.25
        );

        osc.start(start);
        osc.stop(start + 0.27);

    });
}


/* ==================================================
   WRONG SOUND
================================================== */

function playWrongSound(){

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx = new AudioContext();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        190,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        65,
        ctx.currentTime + 0.4
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(
        0.25,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.42
    );

    osc.start();
    osc.stop(ctx.currentTime + 0.43);
}


/* ==================================================
   CELEBRATION SOUND
================================================== */

function playCelebrationSound(){

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx = new AudioContext();

    const notes = [
        523,659,784,1046,
        784,1046,1318,
        1568
    ];

    notes.forEach(function(freq,index){

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "triangle";
        osc.frequency.value = freq;

        osc.connect(gain);
        gain.connect(ctx.destination);

        const start =
            ctx.currentTime + index * 0.11;

        gain.gain.setValueAtTime(
            0.001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            0.3,
            start + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            start + 0.3
        );

        osc.start(start);
        osc.stop(start + 0.32);

    });
}


/* ==================================================
   SAD SOUND
================================================== */

function playSadSound(){

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx = new AudioContext();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
        330,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        110,
        ctx.currentTime + 1.2
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(
        0.23,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 1.2
    );

    osc.start();
    osc.stop(ctx.currentTime + 1.2);
}


/* ==================================================
   VIBRATION
================================================== */

function vibrate(){

    if(navigator.vibrate){

        navigator.vibrate([
            100,
            50,
            100,
            50,
            160
        ]);

    }
}


/* ==================================================
   FLOWER SHOWER
================================================== */

function flowerShower(amount){

    const flowers = [
        "🌸",
        "🌺",
        "🌼",
        "🌻",
        "💮",
        "🌷",
        "🪻"
    ];

    for(let i=0;i<amount;i++){

        const flower =
            document.createElement("div");

        flower.className = "flower";

        flower.innerHTML =
            flowers[
                Math.floor(
                    Math.random() *
                    flowers.length
                )
            ];

        flower.style.left =
            Math.random() * 100 + "vw";

        flower.style.fontSize =
            (18 + Math.random()*25) + "px";

        flower.style.animationDuration =
            (2.5 + Math.random()*3) + "s";

        flower.style.animationDelay =
            Math.random() * 1.2 + "s";

        document.body.appendChild(flower);

        setTimeout(function(){

            flower.remove();

        },6500);

    }
}


/* ==================================================
   CHECK ANSWER
================================================== */

function checkAnswer(button,selected){

    if(submitted){
        return;
    }

    const question =
        button.closest(".question");

    if(question.classList.contains("answered")){
        return;
    }

    const correctAnswer =
        question.getAttribute("data-answer");

    const options =
        question.querySelectorAll(".option");

    question.classList.add("answered");

    attempted++;


    options.forEach(function(option){

        option.disabled = true;

    });


    /* CORRECT */

    if(selected === correctAnswer){

        score++;

        button.classList.add("correct");

        button.querySelector(".mark").innerHTML =
            "✓";

        playCorrectSound();

        flowerShower(25);

    }


    /* WRONG */

    else{

        button.classList.add("wrong");

        button.querySelector(".mark").innerHTML =
            "✕";

        playWrongSound();

        vibrate();

    }

}


/* ==================================================
   SUBMIT QUIZ
================================================== */

function submitQuiz(){

    if(submitted){
        return;
    }


    /* सभी प्रश्नों का उत्तर जरूरी */

    if(attempted < 3){

        alert(
            "कृपया सभी 3 प्रश्नों का उत्तर दें।"
        );

        return;
    }


    submitted = true;


    const total = 3;

    const wrong =
        total - score;

    const percentage =
        Math.round(
            (score / total) * 100
        );


    /* RESULT NUMBERS */

    document.getElementById(
        "correctCount"
    ).innerHTML = score;


    document.getElementById(
        "wrongCount"
    ).innerHTML = wrong;


    document.getElementById(
        "scoreCount"
    ).innerHTML =
        score + " / " + total;


    document.getElementById(
        "percentage"
    ).innerHTML =
        percentage + "%";


    document.getElementById(
        "resultArea"
    ).style.display = "block";


    const message =
        document.getElementById(
            "finalMessage"
        );


    /* ==================================================
       70% OR MORE
    ================================================== */

    if(percentage >= 70){

        message.innerHTML =
            "🎉 बहुत शानदार! शानदार प्रदर्शन! 🎉";

        message.style.background =
            "#d8f8df";

        message.style.color =
            "#087522";

        message.style.border =
            "2px solid #20a13a";


        playCelebrationSound();

        flowerShower(120);

    }


    /* ==================================================
       40% TO 69%
    ================================================== */

    else if(percentage >= 40){

        message.innerHTML =
            "👍 अच्छा प्रयास! थोड़ी और मेहनत करें।";

        message.style.background =
            "#fff0c9";

        message.style.color =
            "#956d00";

        message.style.border =
            "2px solid #e0a500";


        flowerShower(35);

    }


    /* ==================================================
       BELOW 40%
    ================================================== */

    else{

        message.innerHTML =
            "😔 कोई बात नहीं! दोबारा प्रयास करें, अगली बार बेहतर होगा।";

        message.style.background =
            "#ffdede";

        message.style.color =
            "#b00000";

        message.style.border =
            "2px solid #e33434";


        playSadSound();

        vibrate();

    }


    document.getElementById(
        "submitBtn"
    ).disabled = true;


    document.getElementById(
        "resultArea"
    ).scrollIntoView({
        behavior:"smooth"
    });

}


/* ==================================================
   RESET QUIZ
================================================== */

function resetQuiz(){

    score = 0;
    attempted = 0;
    submitted = false;


    document.querySelectorAll(
        ".question"
    ).forEach(function(question){

        question.classList.remove(
            "answered"
        );


        question.querySelectorAll(
            ".option"
        ).forEach(function(option){

            option.disabled = false;

            option.classList.remove(
                "correct",
                "wrong"
            );


            option.querySelector(
                ".mark"
            ).innerHTML = "✓";

        });

    });


    document.getElementById(
        "resultArea"
    ).style.display = "none";


    document.getElementById(
        "submitBtn"
    ).disabled = false;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

</script>

</body>
                    </html>
