<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FARHAN BHAIYA - Biology Quiz</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:18px 10px 50px;
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:linear-gradient(135deg,#eef7ff,#fff8ec,#f2fff4);
    color:#172033;
}

.container{
    max-width:1000px;
    margin:auto;
}


/* =========================================
   FARHAN BOX
========================================= */

.farhan-box{
    text-align:center;
    margin-bottom:16px;
}

.farhan{
    display:inline-block;
    padding:12px 30px;
    border-radius:17px;
    color:white;
    font-size:37px;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(135deg,#7b1fa2,#e91e63,#ff9800);
    border:3px solid white;
    box-shadow:
        0 5px 18px rgba(100,0,120,.30),
        inset 0 0 12px rgba(255,255,255,.25);
    text-shadow:0 2px 4px rgba(0,0,0,.35);
}


/* =========================================
   HEADINGS
========================================= */

.main-heading{
    text-align:center;
    font-size:40px;
    line-height:1.4;
    font-weight:900;
    padding:17px 12px;
    border-radius:15px;
    color:white;
    background:linear-gradient(90deg,#00695c,#00838f,#3949ab);
    box-shadow:0 5px 15px rgba(0,80,100,.25);
    margin-bottom:11px;
}

.sub-heading{
    text-align:center;
    font-size:30px;
    line-height:1.5;
    font-weight:800;
    color:#7b1fa2;
    background:#fff;
    border:2px solid #ce93d8;
    border-radius:12px;
    padding:11px;
    margin-bottom:20px;
}


/* =========================================
   QUESTION CARD
========================================= */

.question-card{
    position:relative;
    background:rgba(255,255,255,.96);
    border-radius:17px;
    padding:20px;
    margin:18px 0;
    border-left:8px solid #3949ab;
    box-shadow:0 5px 17px rgba(30,50,80,.14);
    overflow:hidden;
}

.question{
    font-size:29px;
    line-height:1.7;
    font-weight:800;
    margin-bottom:14px;
}


/* =========================================
   QUESTION NUMBER
========================================= */

.q-number{
    display:inline-block;
    padding:6px 12px;
    border-radius:8px;
    background:#3949ab;
    color:white;
    margin-right:8px;
    font-size:23px;
    font-weight:900;
}


/* =========================================
   OPTIONS
========================================= */

.option{
    position:relative;
    width:100%;
    text-align:left;
    margin:12px 0;
    padding:16px 58px 16px 18px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#d7e8ff,#bcd6f7);
    color:#15233b;
    font-size:26px;
    line-height:1.6;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 7px rgba(30,60,100,.18);
    transition:.25s ease;
}

.option:hover{
    transform:translateX(4px);
    background:linear-gradient(135deg,#c2daf8,#a8c9f0);
}

.option:active{
    transform:scale(.98);
}


/* =========================================
   WRONG
========================================= */

.option.wrong{
    background:linear-gradient(135deg,#d83b45,#a91420);
    color:white;
    box-shadow:0 5px 14px rgba(180,0,20,.35);
}


/* =========================================
   CORRECT
========================================= */

.option.correct{
    background:linear-gradient(135deg,#198754,#0d6b43);
    color:white;
    box-shadow:0 5px 14px rgba(0,110,60,.35);
}


/* =========================================
   CORRECT REVEAL
========================================= */

.option.reveal-correct{
    background:linear-gradient(135deg,#17844e,#0b673e);
    color:white;
}


/* =========================================
   TICK
========================================= */

.tick{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:900;
    background:#1677ff;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
}


/* =========================================
   CROSS
========================================= */

.cross{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:900;
    background:#e31b23;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
}


/* =========================================
   CONCLUSION
========================================= */

.conclusion{
    display:none;
    margin:7px 4px 12px;
    padding:13px 17px;
    border-radius:10px;
    font-size:23px;
    line-height:1.7;
    font-weight:600;
}

.conclusion.show{
    display:block;
}

.conclusion.green{
    background:#d8f4e5;
    color:#075b32;
    border-left:6px solid #159447;
}

.conclusion.red{
    background:#ffe0e2;
    color:#8d1720;
    border-left:6px solid #d32635;
}


/* =========================================
   SUBMIT
========================================= */

.submit-area{
    text-align:center;
    margin:35px 0;
}

.submit-btn{
    border:none;
    padding:19px 50px;
    border-radius:14px;
    font-size:32px;
    font-weight:900;
    color:white;
    background:linear-gradient(135deg,#6a1b9a,#283593,#00695c);
    box-shadow:0 6px 18px rgba(50,30,120,.35);
    cursor:pointer;
}

.submit-btn:hover{
    transform:translateY(-2px);
}


/* =========================================
   RESULT
========================================= */

.result{
    display:none;
    margin-top:28px;
}

.result-title{
    text-align:center;
    font-size:38px;
    font-weight:900;
    color:white;
    background:linear-gradient(90deg,#4a148c,#ad1457,#00695c);
    padding:17px;
    border-radius:14px;
    margin-bottom:17px;
}


/* =========================================
   RESULT GRID
========================================= */

.result-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.result-box{
    padding:20px 10px;
    border-radius:14px;
    text-align:center;
    color:white;
    box-shadow:0 5px 13px rgba(0,0,0,.22);
}

.result-box .label{
    font-size:24px;
    font-weight:800;
}

.result-box .value{
    font-size:43px;
    font-weight:900;
    margin-top:5px;
}


/* सही */

.green-box{
    background:linear-gradient(135deg,#087f46,#064d2e);
}


/* गलत */

.red-box{
    background:linear-gradient(135deg,#c62828,#7f1010);
}


/* SELECTED */

.selected-box{
    background:linear-gradient(135deg,#1565c0,#0d47a1);
}


/* SKIPPED */

.skip-box{
    background:linear-gradient(135deg,#ef6c00,#e65100);
}


/* SCORE */

.score-box{
    background:linear-gradient(135deg,#6a1b9a,#452080);
}


/* PERCENTAGE */

.percent-box{
    background:linear-gradient(135deg,#00838f,#005662);
}


/* =========================================
   FLOWER
========================================= */

.flower-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:9999;
}

.petal{
    position:fixed;
    width:13px;
    height:18px;
    border-radius:70% 30% 70% 30%;
    opacity:1;
    pointer-events:none;
    animation:petalMove 2.4s linear forwards;
}

@keyframes petalMove{

    0%{
        transform:translate(0,0) rotate(0deg);
        opacity:1;
    }

    25%{
        transform:translate(var(--x1),var(--y1)) rotate(100deg);
        opacity:1;
    }

    55%{
        transform:translate(var(--x2),var(--y2)) rotate(220deg);
        opacity:.9;
    }

    80%{
        transform:translate(var(--x3),var(--y3)) rotate(310deg);
        opacity:.65;
    }

    100%{
        transform:translate(var(--x4),var(--y4)) rotate(430deg);
        opacity:0;
    }
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    body{
        padding:12px 7px 45px;
    }

    .farhan{
        font-size:31px;
        padding:10px 22px;
    }

    .main-heading{
        font-size:34px;
        line-height:1.5;
        padding:14px 9px;
    }

    .sub-heading{
        font-size:25px;
        line-height:1.6;
        padding:9px;
    }

    .question-card{
        padding:16px 13px;
        margin:17px 0;
        border-left-width:7px;
    }

    .question{
        font-size:25px;
        line-height:1.75;
    }

    .q-number{
        font-size:21px;
        padding:5px 10px;
    }

    .option{
        font-size:23px;
        line-height:1.7;
        padding:14px 52px 14px 14px;
        margin:11px 0;
    }

    .conclusion{
        font-size:21px;
        line-height:1.75;
        padding:12px 14px;
    }

    .tick,
    .cross{
        width:34px;
        height:34px;
        font-size:23px;
        right:12px;
    }

    .submit-btn{
        font-size:28px;
        padding:17px 35px;
    }

    .result-title{
        font-size:33px;
    }

    .result-box .label{
        font-size:20px;
    }

    .result-box .value{
        font-size:35px;
    }

    .result-grid{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

}

</style>
</head>


<body>

<div class="container">


<div class="farhan-box">
    <div class="farhan">
        ✨ FARHAN BHAIYA ✨
    </div>
</div>


<div class="main-heading">
    🧬 BIOLOGY - जैव प्रक्रम 🧬
</div>


<div class="sub-heading">
    📚 QUESTION BANK OBJECTIVE • पोषण • 63 प्रश्न
</div>


<div id="quiz"></div>


<div class="submit-area">

    <button class="submit-btn" onclick="submitQuiz()">
        🏆 SUBMIT QUIZ 🏆
    </button>

</div>


<div class="result" id="result">

    <div class="result-title">
        🎉 QUIZ RESULT 🎉
    </div>


    <div class="result-grid">


        <!-- सही -->

        <div class="result-box green-box">

            <div class="label">
                सही उत्तर
            </div>

            <div class="value" id="correctCount">
                0
            </div>

        </div>


        <!-- गलत -->

        <div class="result-box red-box">

            <div class="label">
                गलत उत्तर
            </div>

            <div class="value" id="wrongCount">
                0
            </div>

        </div>


        <!-- SELECTED -->

        <div class="result-box selected-box">

            <div class="label">
                Select किए गए
            </div>

            <div class="value" id="selectedCount">
                0
            </div>

        </div>


        <!-- SKIPPED -->

        <div class="result-box skip-box">

            <div class="label">
                Skip किए गए
            </div>

            <div class="value" id="skippedCount">
                0
            </div>

        </div>


        <!-- SCORE -->

        <div class="result-box score-box">

            <div class="label">
                SCORE
            </div>

            <div class="value" id="score">
                0 / 63
            </div>

        </div>


        <!-- PERCENTAGE -->

        <div class="result-box percent-box">

            <div class="label">
                PERCENTAGE
            </div>

            <div class="value" id="percentage">
                0%
            </div>

        </div>


    </div>

</div>

</div>


<div class="flower-layer" id="flowerLayer"></div>


<script>


/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

{
q:"प्रकाश संश्लेषण में बाहर निकलने वाली ऑक्सीजन का मुख्य स्रोत क्या है?",
o:["जल","CO₂","ग्लूकोज","डिक्टियोसोम"],
a:["A"],
e:"प्रकाश संश्लेषण में जल का प्रकाश-अपघटन होता है और इसी से ऑक्सीजन मुक्त होती है।"
},

{
q:"ग्वाइटर या घेंघा सामान्यतः किसकी कमी से होता है?",
o:["चीनी की कमी","आयोडीन की कमी","रक्त की कमी","मोटापा"],
a:["B"],
e:"आयोडीन की कमी से थायरॉइड ग्रंथि का आकार बढ़ सकता है और घेंघा हो सकता है।"
},

{
q:"कूटपाद किस जीव में पाए जाते हैं?",
o:["पैरामीशियम","यूग्लीना","अमीबा","इनमें से कोई नहीं"],
a:["C"],
e:"अमीबा कूटपाद बनाकर चलता है और इन्हीं की सहायता से भोजन को पकड़ता है।"
},

{
q:"मंड परीक्षण से पहले हरी पत्ती को अल्कोहल में क्यों उबाला जाता है?",
o:["मंड को घोलने के लिए","क्लोरोफिल हटाने के लिए","पत्ती को मुलायम करने के लिए","इन सभी कारणों से"],
a:["B"],
e:"अल्कोहल पत्ती से क्लोरोफिल निकाल देता है, जिससे आयोडीन द्वारा मंड की जाँच स्पष्ट दिखाई देती है।"
},

{
q:"Compound microscope में स्लाइड को सबसे पहले किस आवर्धन पर देखना उचित है?",
o:["5×","10×","25×","45×"],
a:["B"],
e:"सूक्ष्मदर्शी में वस्तु को पहले कम आवर्धन पर खोजा जाता है; दिए विकल्पों में 10× सही है।"
},

{
q:"ग्लूकोज C₆H₁₂O₆ के एक अणु में ऑक्सीजन के कितने परमाणु होते हैं?",
o:["4","6","8","12"],
a:["B"],
e:"सूत्र C₆H₁₂O₆ में O के नीचे 6 है, इसलिए ऑक्सीजन के 6 परमाणु होते हैं।"
},

{
q:"दाँत साफ करने वाला दंत-मंजन सामान्यतः कैसा होता है?",
o:["क्षारीय","अम्लीय","लवणयुक्त","इनमें से कोई नहीं"],
a:["A"],
e:"दंत-मंजन सामान्यतः क्षारीय होता है और मुँह में बनने वाले अम्ल को निष्क्रिय करने में मदद करता है।"
},

{
q:"सामान्यतः हरे पौधे किस प्रकार के पोषण वाले होते हैं?",
o:["स्वपोषी","मृतोपजीवी","परजीवी","इन सभी"],
a:["A"],
e:"हरे पौधे प्रकाश संश्लेषण द्वारा अपना भोजन स्वयं बनाते हैं, इसलिए वे स्वपोषी कहलाते हैं।"
},

{
q:"निम्न में से कौन-सा उभयलिंगी जंतु है?",
o:["केंचुआ","मछली","शेर","बकरी"],
a:["A"],
e:"केंचुए में नर और मादा दोनों प्रकार के जनन अंग पाए जाते हैं, इसलिए यह उभयलिंगी है।"
},

{
q:"अमीबा भोजन को पकड़ने के लिए किसका उपयोग करता है?",
o:["स्पर्शक","जीभ","कूटपाद","मुँह"],
a:["C"],
e:"अमीबा कूटपाद फैलाकर भोजन को घेरता है और फिर उसे कोशिका के अंदर ले जाता है।"
},

{
q:"आयोडीन की कमी से कौन-सा रोग हो सकता है?",
o:["घेंघा","मधुमेह","स्कर्वी","एड्स"],
a:["A"],
e:"आयोडीन थायरॉइड हार्मोन के निर्माण के लिए आवश्यक है। इसकी कमी से घेंघा हो सकता है।"
},

{
q:"पौधे का हरा रंग मुख्यतः किसकी उपस्थिति के कारण होता है?",
o:["क्लोरोफिल","ल्यूकोप्लास्ट","फाइटोक्रोम","इनमें से कोई नहीं"],
a:["A"],
e:"क्लोरोफिल हरे रंग का वर्णक है और प्रकाश संश्लेषण में प्रकाश ऊर्जा को ग्रहण करता है।"
},

{
q:"हाइड्रा में निम्न में से क्या पाया जाता है?",
o:["मस्तिष्क","तंत्रिका","मुख","स्पर्शक"],
a:["D"],
e:"हाइड्रा में मुख के आसपास स्पर्शक पाए जाते हैं, जिनसे वह भोजन पकड़ता है।"
},

{
q:"ग्लूकोज का सही रासायनिक सूत्र कौन-सा है?",
o:["C₂H₅OH","C₆H₆O₆","C₆H₁₂O₆","C₆H₆"],
a:["C"],
e:"ग्लूकोज का रासायनिक सूत्र C₆H₁₂O₆ है।"
},

{
q:"अमीबा में अधिकांश पोषण किस प्रकार का होता है?",
o:["शाकाहारी","अंतर्ग्रहणीय","सर्वाहारी","स्वपोषी"],
a:["B"],
e:"अमीबा भोजन को घेरकर अंदर लेता है और फिर उसे पचाता है। इसे होलोजोइक या अंतर्ग्रहणीय पोषण कहते हैं।"
},

{
q:"प्रकाश संश्लेषण मुख्यतः किन जीवों में होता है?",
o:["कवकों में","जंतुओं में","हरे पौधों में","परजीवियों में"],
a:["C"],
e:"हरे पौधों की क्लोरोफिल वाली कोशिकाएँ प्रकाश की सहायता से प्रकाश संश्लेषण करती हैं।"
},

{
q:"दाँत की सबसे कठोर परत कौन-सी है?",
o:["डेंटिन","इनेमल","मज्जा गुहा","सीमेंट"],
a:["B"],
e:"इनेमल दाँत की सबसे बाहरी और सबसे कठोर परत है।"
},

{
q:"मानव आहार नाल का सबसे लंबा भाग कौन-सा है?",
o:["आमाशय","छोटी आँत","ग्रसनी","बड़ी आँत"],
a:["B"],
e:"छोटी आँत आहार नाल का सबसे लंबा भाग है और यहीं पाचन व अवशोषण का बड़ा भाग होता है।"
},

{
q:"मैग्नीशियम किसमें पाया जाता है?",
o:["क्लोरोफिल","लाल रक्त कण","वर्णी लवक","श्वेत रक्त कण"],
a:["A"],
e:"क्लोरोफिल के अणु के केंद्र में मैग्नीशियम पाया जाता है।"
},

{
q:"स्वपोषी पोषण के लिए कौन-कौन आवश्यक हैं?",

e:"प्रकाश संश्लेषण के लिए ऑक्सीजन कच्चे पदार्थ के रूप में आवश्यक नहीं होती।"
},

{
q:"द्विबीजपत्री पौधों की गार्ड कोशिका की कौन-सी भित्ति अधिक मोटी होती है?",
o:["भीतरी","बाहरी","पार्श्व","इनमें से कोई नहीं"],
a:["A"],
e:"गार्ड कोशिका की भीतरी भित्ति बाहरी भित्ति की तुलना में अधिक मोटी होती है।"
}

];


/* =====================================================
   QUIZ BUILD
===================================================== */

const quiz = document.getElementById("quiz");


let states = questions.map(() => ({

    locked:false,

    selected:null,

    answered:false

}));


function createQuiz(){

    questions.forEach((item,index)=>{

        const card=document.createElement("div");

        card.className="question-card";

        card.dataset.index=index;


        const q=document.createElement("div");

        q.className="question";


        q.innerHTML=
            `<span class="q-number">
                Q${index+1}
             </span>
             ${item.q}`;


        card.appendChild(q);


        item.o.forEach((text,optIndex)=>{

            const letter=
                String.fromCharCode(65+optIndex);


            const wrapper=
                document.createElement("div");


            const btn=
                document.createElement("button");


            btn.className="option";

            btn.dataset.letter=letter;


            btn.innerHTML=
                `(${letter}) ${text}`;


            const conclusion=
                document.createElement("div");


            conclusion.className=
                "conclusion";


            wrapper.appendChild(btn);

            wrapper.appendChild(conclusion);

            card.appendChild(wrapper);


            btn.addEventListener(
                "click",
                ()=>{

                    handleOption(
                        index,
                        letter,
                        btn,
                        conclusion,
                        card
                    );

                }
            );

        });


        quiz.appendChild(card);

    });

}


createQuiz();


/* =====================================================
   OPTION CLICK
===================================================== */

function handleOption(
    qIndex,
    letter,
    btn,
    conclusion,
    card
){

    const state=
        states[qIndex];


    const question=
        questions[qIndex];


    /*
       पहली बार click
    */

    if(!state.locked){

        state.locked=true;

        state.selected=letter;

        state.answered=true;


        const isCorrect=
            question.a.includes(letter);


        const buttons=
            card.querySelectorAll(".option");


        buttons.forEach((b)=>{

            const l=
                b.dataset.letter;


            if(question.a.includes(l)){

                b.classList.add(
                    "reveal-correct"
                );

            }

        });


        /*
           सही
        */

        if(isCorrect){

            btn.classList.remove(
                "reveal-correct"
            );

            btn.classList.add(
                "correct"
            );


            const tick=
                document.createElement(
                    "span"
                );


            tick.className="tick";

            tick.innerHTML="✓";


            btn.appendChild(tick);


            showConclusion(
                conclusion,
                true,
                question.e
            );


            correctSound();


            flowerBurst(btn);

        }


        /*
           गलत
        */

        else{

            btn.classList.remove(
                "reveal-correct"
            );

            btn.classList.add(
                "wrong"
            );


            const cross=
                document.createElement(
                    "span"
                );


            cross.className="cross";

            cross.innerHTML="×";


            btn.appendChild(cross);


            showConclusion(
                conclusion,
                false,
                question.e
            );


            vibrateOnce();

        }

    }


    /*
       Locked होने के बाद answer change नहीं होगा।
       लेकिन किसी option पर click करने पर उसका
       conclusion दिखाया जा सकता है।
    */

    else{

        const isCorrect=
            question.a.includes(letter);


        showConclusion(
            conclusion,
            isCorrect,
            question.e
        );

    }

}


/* =====================================================
   CONCLUSION
===================================================== */

function showConclusion(
    el,
    isCorrect,
    text
){

    const card=
        el.closest(".question-card");


    card.querySelectorAll(".conclusion")
        .forEach(c=>{

            c.classList.remove(
                "show",
                "green",
                "red"
            );

        });


    el.innerHTML=
        `<b>
            ${isCorrect ? "✓ सही:" : "✗ गलत:"}
        </b>
        ${text}`;


    el.classList.add("show");


    if(isCorrect){

        el.classList.add("green");

    }else{

        el.classList.add("red");

    }

}


/* =====================================================
   VIBRATION
===================================================== */

function vibrateOnce(){

    if(navigator.vibrate){

        navigator.vibrate(500);

    }

}


/* =====================================================
   AUDIO
===================================================== */

let audioCtx=null;


function getAudio(){

    if(!audioCtx){

        audioCtx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(audioCtx.state==="suspended"){

        audioCtx.resume();

    }


    return audioCtx;

}


/* =====================================================
   CORRECT SOUND
===================================================== */

function correctSound(){

    const ctx=
        getAudio();


    const osc=
        ctx.createOscillator();


    const gain=
        ctx.createGain();


    osc.type="sine";


    osc.frequency.setValueAtTime(
        600,
        ctx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        1100,
        ctx.currentTime+0.28
    );


    gain.gain.setValueAtTime(
        0.0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.20,
        ctx.currentTime+0.03
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime+0.45
    );


    osc.connect(gain);

    gain.connect(ctx.destination);


    osc.start();

    osc.stop(
        ctx.currentTime+0.5
    );

}


/* =====================================================
   CELEBRATION SOUND
===================================================== */

function celebrationSound(){

    const ctx=
        getAudio();


    const notes=[
        523,
        659,
        784,
        1046,
        1318
    ];


    notes.forEach((freq,i)=>{

        const osc=
            ctx.createOscillator();


        const gain=
            ctx.createGain();


        osc.type="triangle";


        osc.frequency.value=
            freq;


        const start=
            ctx.currentTime+i*.12;


        gain.gain.setValueAtTime(
            0.0001,
            start
        );


        gain.gain.exponentialRampToValueAtTime(
            .16,
            start+.03
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            start+.30
        );


        osc.connect(gain);

        gain.connect(ctx.destination);


        osc.start(start);

        osc.stop(start+.34);

    });

}


/* =====================================================
   SAD SOUND
===================================================== */

function sadSound(){

    const ctx=
        getAudio();


    const osc=
        ctx.createOscillator();


    const gain=
        ctx.createGain();


    osc.type="sine";


    osc.frequency.setValueAtTime(
        380,
        ctx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        130,
        ctx.currentTime+0.8
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .16,
        ctx.currentTime+.05
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime+.9
    );


    osc.connect(gain);

    gain.connect(ctx.destination);


    osc.start();

    osc.stop(
        ctx.currentTime+1
    );

}


/* =====================================================
   FLOWER EFFECT
===================================================== */

function flowerBurst(button){

    const rect=
        button.getBoundingClientRect();


    const startX=
        rect.left+
        rect.width/2;


    const startY=
        rect.top+
        rect.height/2;


    const total=24;


    for(let i=0;i<total;i++){

        setTimeout(()=>{

            createPetal(
                startX,
                startY
            );

        },i*55);

    }

}


function createPetal(x,y){

    const petal=
        document.createElement("span");


    petal.className="petal";


    const symbols=[
        "🌸",
        "🌺",
        "✿",
        "❀"
    ];


    petal.textContent=
        symbols[
            Math.floor(
                Math.random()*
                symbols.length
            )
        ];


    petal.style.fontSize=
        (11+
        Math.random()*9)+"px";


    petal.style.left=
        x+"px";


    petal.style.top=
        y+"px";


    const direction=
        Math.random()<.5
        ? -1
        : 1;


    const x1=
        direction*
        (20+
        Math.random()*60)
        +"px";


    const y1=
        -(60+
        Math.random()*80)
        +"px";


    const x2=
        direction*
        (70+
        Math.random()*150)
        +"px";


    const y2=
        -(90+
        Math.random()*130)
        +"px";


    const x3=
        direction*
        (120+
        Math.random()*230)
        +"px";


    const y3=
        -(30+
        Math.random()*100)
        +"px";


    const x4=
        direction*
        (180+
        Math.random()*330)
        +"px";


    const y4=
        (20+
        Math.random()*220)
        +"px";


    petal.style.setProperty(
        "--x1",
        x1
    );


    petal.style.setProperty(
        "--y1",
        y1
    );


    petal.style.setProperty(
        "--x2",
        x2
    );


    petal.style.setProperty(
        "--y2",
        y2
    );


    petal.style.setProperty(
        "--x3",
        x3
    );


    petal.style.setProperty(
        "--y3",
        y3
    );


    petal.style.setProperty(
        "--x4",
        x4
    );


    petal.style.setProperty(
        "--y4",
        y4
    );


    document
        .getElementById("flowerLayer")
        .appendChild(petal);


    setTimeout(()=>{

        petal.remove();

    },2500);

}


/* =====================================================
   SUBMIT QUIZ
===================================================== */

function submitQuiz(){

    let correct=0;

    let wrong=0;

    let selected=0;

    let skipped=0;


    questions.forEach(
        (question,index)=>{

            const state=
                states[index];


            /*
               प्रश्न select किया गया
            */

            if(state.locked){

                selected++;


                /*
                   सही
                */

                if(
                    question.a.includes(
                        state.selected
                    )
                ){

                    correct++;

                }

                /*
                   गलत
                */

                else{

                    wrong++;

                }

            }

            /*
               प्रश्न skip किया गया
            */

            else{

                skipped++;

            }

        }
    );


    const total=
        questions.length;


    const percentage=
        ((correct/total)*100)
        .toFixed(2);


    /*
       RESULT VALUES
    */

    document.getElementById(
        "correctCount"
    ).textContent=
        correct;


    document.getElementById(
        "wrongCount"
    ).textContent=
        wrong;


    document.getElementById(
        "selectedCount"
    ).textContent=
        selected;


    document.getElementById(
        "skippedCount"
    ).textContent=
        skipped;


    document.getElementById(
        "score"
    ).textContent=
        correct+
        " / "+
        total;


    document.getElementById(
        "percentage"
    ).textContent=
        percentage+
        "%";


    /*
       RESULT SHOW
    */

    document.getElementById(
        "result"
    ).style.display=
        "block";


    /*
       Options shadow
    */

    document
        .querySelectorAll(".option")
        .forEach(option=>{

            option.style.boxShadow=
                "0 5px 12px rgba(30,40,80,.25)";

        });


    /*
       Result पर scroll
    */

    document
        .getElementById("result")
        .scrollIntoView({

            behavior:"smooth",

            block:"center"

        });


    /*
       Celebration
    */

    if(percentage>=70){

        celebrationSound();


        for(let i=0;i<5;i++){

            setTimeout(()=>{

                const fake={

                    getBoundingClientRect:()=>({

                        left:
                        100+
                        Math.random()*
                        (
                            window.innerWidth-
                            200
                        ),

                        top:
                        150+
                        Math.random()*400,

                        width:80,

                        height:40

                    })

                };


                flowerBurst(fake);

            },i*250);

        }

    }

    else{

        sadSound();

    }

}


/* =====================================================
   PREVENT DOUBLE SUBMIT ISSUES
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        if(audioCtx){

            audioCtx.close();

        }

    }
);

</script>
