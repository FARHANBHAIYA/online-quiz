<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FARHAN BHAIYA - Biology Quiz</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px 10px 60px;
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:linear-gradient(135deg,#eef7ff,#fff8ec,#f2fff4);
    color:#172033;
}

.container{
    max-width:1000px;
    margin:auto;
}

/* FARHAN */
.farhan-box{
    text-align:center;
    margin-bottom:18px;
}

.farhan{
    display:inline-block;
    padding:13px 30px;
    border-radius:18px;
    color:white;
    font-size:32px;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(135deg,#7b1fa2,#e91e63,#ff9800);
    border:3px solid white;
    box-shadow:
        0 6px 20px rgba(100,0,120,.30),
        inset 0 0 14px rgba(255,255,255,.25);
    text-shadow:0 2px 4px rgba(0,0,0,.35);
}

/* HEADINGS */
.main-heading{
    text-align:center;
    font-size:38px;
    font-weight:900;
    padding:18px 12px;
    border-radius:18px;
    color:white;
    background:linear-gradient(90deg,#00695c,#00838f,#3949ab);
    box-shadow:0 6px 18px rgba(0,80,100,.25);
    margin-bottom:12px;
}

.sub-heading{
    text-align:center;
    font-size:27px;
    font-weight:900;
    color:#7b1fa2;
    background:#fff;
    border:3px solid #ce93d8;
    border-radius:15px;
    padding:12px;
    margin-bottom:22px;
}

/* QUESTION CARD */
.question-card{
    position:relative;
    background:rgba(255,255,255,.98);
    border-radius:20px;
    padding:20px;
    margin:22px 0;
    border:3px solid #7986cb;
    border-left:11px solid #3949ab;
    box-shadow:0 7px 20px rgba(30,50,80,.16);
    overflow:hidden;
}

/* QUESTION BOX */
.question{
    font-size:34px;
    line-height:1.55;
    font-weight:900;
    margin-bottom:20px;
    padding:18px 20px;
    border-radius:16px;
    color:#172033;
    background:linear-gradient(135deg,#e3f2fd,#ede7f6);
    border:4px solid #5c6bc0;
    box-shadow:0 5px 14px rgba(50,60,130,.18);
}

/* QUESTION NUMBER */
.q-number{
    display:inline-block;
    padding:6px 13px;
    border-radius:10px;
    background:#3949ab;
    color:white;
    margin-right:10px;
    font-size:25px;
    font-weight:900;
}

/* OPTIONS */
.option{
    position:relative;
    width:100%;
    text-align:left;
    margin:14px 0;
    padding:19px 65px 19px 20px;
    border:3px solid #90caf9;
    border-radius:15px;
    background:linear-gradient(135deg,#d7e8ff,#bcd6f7);
    color:#15233b;
    font-size:30px;
    line-height:1.45;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 9px rgba(30,60,100,.18);
    transition:.25s ease;
}

.option:hover{
    transform:translateX(5px);
    background:linear-gradient(135deg,#c2daf8,#a8c9f0);
}

.option:active{
    transform:scale(.98);
}

.option.wrong{
    background:linear-gradient(135deg,#d83b45,#a91420);
    color:white;
    border-color:#8e111b;
}

.option.correct{
    background:linear-gradient(135deg,#198754,#0d6b43);
    color:white;
    border-color:#07552f;
}

.option.reveal-correct{
    background:linear-gradient(135deg,#17844e,#0b673e);
    color:white;
    border-color:#07552f;
}

/* TICK / CROSS */
.tick{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:900;
    background:#1677ff;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
}

.cross{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:900;
    background:#e31b23;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
}

/* CONCLUSION */
.conclusion{
    display:none;
    margin:5px 2px 15px;
    padding:18px 20px;
    border-radius:14px;
    font-size:25px;
    line-height:1.65;
    font-weight:700;
}

.conclusion.show{
    display:block;
}

.conclusion.green{
    background:#d8f4e5;
    color:#075b32;
    border:3px solid #159447;
    border-left:8px solid #159447;
}

.conclusion.red{
    background:#ffe0e2;
    color:#8d1720;
    border:3px solid #d32635;
    border-left:8px solid #d32635;
}

/* SUBMIT */
.submit-area{
    text-align:center;
    margin:40px 0;
}

.submit-btn{
    border:none;
    padding:20px 50px;
    border-radius:17px;
    font-size:30px;
    font-weight:900;
    color:white;
    background:linear-gradient(135deg,#6a1b9a,#283593,#00695c);
    box-shadow:0 7px 20px rgba(50,30,120,.35);
    cursor:pointer;
}

.submit-btn:hover{
    transform:translateY(-2px);
}

/* RESULT */
.result{
    display:none;
    margin-top:30px;
}

.result-title{
    text-align:center;
    font-size:36px;
    font-weight:900;
    color:white;
    background:linear-gradient(90deg,#4a148c,#ad1457,#00695c);
    padding:18px;
    border-radius:17px;
    margin-bottom:18px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.result-box{
    padding:22px 12px;
    border-radius:17px;
    text-align:center;
    color:white;
    box-shadow:0 6px 15px rgba(0,0,0,.22);
}

.result-box .label{
    font-size:24px;
    font-weight:900;
}

.result-box .value{
    font-size:42px;
    font-weight:900;
    margin-top:5px;
}

.green-box{
    background:linear-gradient(135deg,#087f46,#064d2e);
}

.red-box{
    background:linear-gradient(135deg,#c62828,#7f1010);
}

.score-box{
    background:linear-gradient(135deg,#1565c0,#0d47a1);
}

.percent-box{
    background:linear-gradient(135deg,#6a1b9a,#452080);
}

/* ATTEMPT / SKIP */
.status-box{
    margin-top:20px;
    padding:22px;
    border-radius:17px;
    font-size:27px;
    line-height:1.7;
    font-weight:800;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.attempt-box{
    background:#e3f2fd;
    border:4px solid #1976d2;
    color:#0d47a1;
}

.skip-box{
    background:#fff3e0;
    border:4px solid #ef6c00;
    color:#e65100;
}

.status-number{
    font-size:36px;
    font-weight:900;
}

/* FLOWER */
.flower-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:9999;
}

.petal{
    position:fixed;
    width:25px;
    height:25px;
    opacity:1;
    pointer-events:none;
    animation:petalMove 2.4s linear forwards;
}

@keyframes petalMove{
    0%{
        transform:translate(0,0) rotate(0deg);
        opacity:1;
    }

    25%{
        transform:translate(var(--x1),var(--y1)) rotate(100deg);
        opacity:1;
    }

    55%{
        transform:translate(var(--x2),var(--y2)) rotate(220deg);
        opacity:.9;
    }

    80%{
        transform:translate(var(--x3),var(--y3)) rotate(310deg);
        opacity:.65;
    }

    100%{
        transform:translate(var(--x4),var(--y4)) rotate(430deg);
        opacity:0;
    }
}

/* MOBILE */
@media(max-width:600px){

    body{
        padding:10px 6px 45px;
    }

    .farhan{
        font-size:27px;
        padding:11px 22px;
    }

    .main-heading{
        font-size:30px;
        padding:15px 8px;
    }

    .sub-heading{
        font-size:22px;
        padding:10px 6px;
    }

    .question-card{
        padding:13px;
        margin:18px 0;
    }

    .question{
        font-size:27px;
        padding:15px;
        line-height:1.55;
    }

    .q-number{
        font-size:21px;
        padding:5px 10px;
    }

    .option{
        font-size:25px;
        padding:16px 55px 16px 15px;
        line-height:1.5;
    }

    .conclusion{
        font-size:22px;
        padding:15px;
    }

    .submit-btn{
        font-size:26px;
        padding:18px 35px;
    }

    .result-title{
        font-size:30px;
    }

    .result-box .label{
        font-size:20px;
    }

    .result-box .value{
        font-size:34px;
    }

    .status-box{
        font-size:22px;
    }

    .status-number{
        font-size:31px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="farhan-box">
<div class="farhan">✨ FARHAN BHAIYA ✨</div>
</div>

<div class="main-heading">
🧬 BIOLOGY - जैव प्रक्रम 🧬
</div>

<div class="sub-heading">
📚 QUESTION BANK OBJECTIVE • पोषण • 63 प्रश्न
</div>

<div id="quiz"></div>

<div class="submit-area">
<button class="submit-btn" onclick="submitQuiz()">
🏆 SUBMIT QUIZ 🏆
</button>
</div>

<div class="result" id="result">

<div class="result-title">
🎉 QUIZ RESULT 🎉
</div>

<div class="result-grid">

<div class="result-box green-box">
<div class="label">सही उत्तर</div>
<div class="value" id="correctCount">0</div>
</div>

<div class="result-box red-box">
<div class="label">गलत उत्तर</div>
<div class="value" id="wrongCount">0</div>
</div>

<div class="result-box score-box">
<div class="label">SCORE</div>
<div class="value" id="score">0 / 63</div>
</div>

<div class="result-box percent-box">
<div class="label">PERCENTAGE</div>
<div class="value" id="percentage">0%</div>
</div>

</div>

<div class="status-box attempt-box">
📝 <b>Attempted Questions</b><br>
<span class="status-number" id="attemptedCount">0</span>
प्रश्न हल किए गए।
</div>

<div class="status-box skip-box">
⏭️ <b>Skipped Questions</b><br>
<span class="status-number" id="skippedCount">0</span>
प्रश्न छोड़ दिए गए।
</div>

</div>

</div>

<div class="flower-layer" id="flowerLayer"></div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

{
q:"प्रकाश संश्लेषण में बाहर निकलने वाली ऑक्सीजन का मुख्य स्रोत क्या है?",
o:["जल","CO₂","ग्लूकोज","डिक्टियोसोम"],
a:["A"],
e:[
"जल प्रकाश-अपघटन द्वारा ऑक्सीजन प्रदान करता है। इसलिए इस प्रश्न में यही सही विकल्प है।",
"CO₂ प्रकाश संश्लेषण का कच्चा पदार्थ है और इससे मुख्यतः कार्बोहाइड्रेट बनते हैं; निकलने वाली O₂ का मूल स्रोत CO₂ नहीं है।",
"ग्लूकोज प्रकाश संश्लेषण का उत्पाद है; इससे बाहर निकलने वाली ऑक्सीजन का मूल स्रोत नहीं माना जाता।",
"डिक्टियोसोम गोल्जी तंत्र से संबंधित कोशिकांग है; इसका ऑक्सीजन निर्माण में यह कार्य नहीं है।"
]
},

{
q:"ग्वाइटर या घेंघा सामान्यतः किसकी कमी से होता है?",
o:["चीनी की कमी","आयोडीन की कमी","रक्त की कमी","मोटापा"],
a:["B"],
e:[
"चीनी की कमी को सामान्यतः घेंघे का कारण नहीं माना जाता। इसका संबंध थायरॉइड हार्मोन के निर्माण से नहीं है।",
"आयोडीन थायरॉइड हार्मोन के निर्माण के लिए आवश्यक है। इसकी कमी से थायरॉइड ग्रंथि बढ़ सकती है और घेंघा हो सकता है।",
"रक्त की कमी यानी एनीमिया का संबंध मुख्यतः हीमोग्लोबिन या आयरन की कमी से होता है, घेंघे से नहीं।",
"मोटापा घेंघे का सामान्य प्रत्यक्ष कारण नहीं है।"
]
},

{
q:"कूटपाद किस जीव में पाए जाते हैं?",
o:["पैरामीशियम","यूग्लीना","अमीबा","इनमें से कोई नहीं"],
a:["C"],
e:[
"पैरामीशियम गति के लिए मुख्यतः सिलिया का उपयोग करता है, इसलिए इस प्रश्न में कूटपाद इसका सही उत्तर नहीं है।",
"यूग्लीना गति के लिए फ्लैजेलम का उपयोग करता है; कूटपाद इसकी विशेष संरचना नहीं हैं।",
"अमीबा कूटपाद बनाकर चलता है और इन्हीं की सहायता से भोजन को घेरकर ग्रहण करता है। इसलिए यह सही उत्तर है।",
"यह विकल्प तभी सही होता जब दिए गए अन्य जीवों में कूटपाद न मिलते; लेकिन अमीबा में कूटपाद स्पष्ट रूप से पाए जाते हैं।"
]
},

{
q:"मंड परीक्षण से पहले हरी पत्ती को अल्कोहल में क्यों उबाला जाता है?",
o:["मंड को घोलने के लिए","क्लोरोफिल हटाने के लिए","पत्ती को मुलायम करने के लिए","इन सभी कारणों से"],
a:["B"],
e:[
"अल्कोहल का मुख्य उद्देश्य मंड को घोलना नहीं, बल्कि पत्ती से क्लोरोफिल निकालना है।",
"अल्कोहल क्लोरोफिल को निकाल देता है। इससे पत्ती का हरा रंग हट जाता है और आयोडीन से मंड की नीला-काला प्रतिक्रिया स्पष्ट दिखाई देती है।",
"पत्ती को मुलायम करना इस प्रयोग का मुख्य उद्देश्य नहीं है।",
"सभी कारण सही नहीं हैं, क्योंकि प्रयोग का मुख्य और अपेक्षित कारण क्लोरोफिल हटाना है।"
]
},

{
q:"Compound microscope में स्लाइड को सबसे पहले किस आवर्धन पर देखना उचित है?",
o:["5×","10×","25×","45×"],
a:["B"],
e:[
"5× इस प्रश्न में दिया गया विकल्प है, लेकिन दिए गए विकल्पों में सामान्य प्रारंभिक आवर्धन के रूप में 10× लिया गया है।",
"कम आवर्धन पर पहले वस्तु को खोजना और फोकस करना आसान होता है। दिए गए विकल्पों में 10× उपयुक्त उत्तर है।",
"25× अधिक आवर्धन है; प्रारंभ में अधिक आवर्धन लेने से वस्तु खोजने का क्षेत्र छोटा हो जाता है।",
"45× बहुत अधिक आवर्धन है और प्रारंभिक खोज के लिए सामान्यतः उपयुक्त विकल्प नहीं है।"
]
},

{
q:"ग्लूकोज C₆H₁₂O₆ के एक अणु में ऑक्सीजन के कितने परमाणु होते हैं?",
o:["4","6","8","12"],
a:["B"],
e:[
"C₆H₁₂O₆ में ऑक्सीजन के आगे 6 लिखा है, इसलिए 4 सही नहीं है।",
"C₆H₁₂O₆ में O₆ का अर्थ है कि एक ग्लूकोज अणु में ऑक्सीजन के 6 परमाणु हैं।",
"ग्लूकोज के एक अणु में 8 ऑक्सीजन परमाणु नहीं होते। सूत्र स्वयं 6 बताता है।",
"12 संख्या हाइड्रोजन परमाणुओं की है, ऑक्सीजन की नहीं।"
]
},

{
q:"दाँत साफ करने वाला दंत-मंजन सामान्यतः कैसा होता है?",
o:["क्षारीय","अम्लीय","लवणयुक्त","इनमें से कोई नहीं"],
a:["A"],
e:[
"दंत-मंजन सामान्यतः क्षारीय होता है। यह मुँह में बनने वाले अम्ल को निष्क्रिय करने में सहायता करता है, इसलिए यह सही विकल्प है।",
"अम्लीय पदार्थ दाँतों के इनेमल को नुकसान पहुँचा सकते हैं; इसलिए सामान्य दंत-मंजन को अम्लीय नहीं माना जाता।",
"दंत-मंजन में लवण या अन्य पदार्थ हो सकते हैं, लेकिन इस प्रश्न में उसका प्रमुख गुण क्षारीय होना है।",
"यह विकल्प सही नहीं है, क्योंकि दंत-मंजन के लिए क्षारीय गुण बताया जाता है।"
]
},

{
q:"सामान्यतः हरे पौधे किस प्रकार के पोषण वाले होते हैं?",
o:["स्वपोषी","मृतोपजीवी","परजीवी","इन सभी"],
a:["A"],
e:[
"हरे पौधे प्रकाश संश्लेषण द्वारा अपना भोजन स्वयं बनाते हैं। इसलिए उनका पोषण स्वपोषी कहलाता है।",

/* =====================================================
   STATE
===================================================== */

const quiz=document.getElementById("quiz");

const states=questions.map(()=>({
    locked:false,
    selected:null,
    answered:false
}));

/* =====================================================
   OPTION-SPECIFIC EXPLANATION
===================================================== */

function makeConclusion(question,index,letter){

    const optionIndex=letter.charCodeAt(0)-65;

    if(question.e && question.e[optionIndex]){
        return question.e[optionIndex];
    }

    const correct=question.a.includes(letter);

    if(correct){
        return "✓ यह विकल्प सही है। प्रश्न में पूछी गई अवधारणा इसी विकल्प से संबंधित है।";
    }

    return "✗ यह विकल्प इस प्रश्न के लिए सही नहीं है। सही उत्तर है: "+
           question.a.join(" और ")+"।";
}

/* =====================================================
   BUILD QUIZ
===================================================== */

function createQuiz(){

    questions.forEach((item,index)=>{

        const card=document.createElement("div");

        card.className="question-card";
        card.dataset.index=index;

        const q=document.createElement("div");

        q.className="question";

        q.innerHTML=
        `<span class="q-number">Q${index+1}</span>${item.q}`;

        card.appendChild(q);

        item.o.forEach((text,optIndex)=>{

            const letter=String.fromCharCode(65+optIndex);

            const wrapper=document.createElement("div");

            const btn=document.createElement("button");

            btn.className="option";
            btn.dataset.letter=letter;

            btn.innerHTML=`(${letter}) ${text}`;

            const conclusion=document.createElement("div");

            conclusion.className="conclusion";

            wrapper.appendChild(btn);
            wrapper.appendChild(conclusion);

            card.appendChild(wrapper);

            btn.addEventListener("click",()=>{

                handleOption(
                    index,
                    letter,
                    btn,
                    conclusion,
                    card
                );

            });

        });

        quiz.appendChild(card);

    });
}

createQuiz();

/* =====================================================
   OPTION CLICK
===================================================== */

function handleOption(
    qIndex,
    letter,
    btn,
    conclusion,
    card
){

    const state=states[qIndex];

    const question=questions[qIndex];

    /* पहली बार उत्तर */

    if(!state.locked){

        state.locked=true;
        state.selected=letter;
        state.answered=true;

        const isCorrect=
            question.a.includes(letter);

        const buttons=
            card.querySelectorAll(".option");

        buttons.forEach(b=>{

            const l=b.dataset.letter;

            if(question.a.includes(l)){
                b.classList.add("reveal-correct");
            }

        });

        if(isCorrect){

            btn.classList.remove(
                "reveal-correct"
            );

            btn.classList.add("correct");

            const tick=
                document.createElement("span");

            tick.className="tick";
            tick.innerHTML="✓";

            btn.appendChild(tick);

            showConclusion(
                conclusion,
                true,
                makeConclusion(
                    question,
                    qIndex,
                    letter
                )
            );

            correctSound();

            flowerBurst(btn);

        }else{

            btn.classList.remove(
                "reveal-correct"
            );

            btn.classList.add("wrong");

            const cross=
                document.createElement("span");

            cross.className="cross";
            cross.innerHTML="×";

            btn.appendChild(cross);

            showConclusion(
                conclusion,
                false,
                makeConclusion(
                    question,
                    qIndex,
                    letter
                )
            );

            vibrateOnce();

        }

    }else{

        /*
           उत्तर पहले ही lock हो चुका है।
           अब किसी option पर दबाने पर
           उसी option का अलग explanation दिखेगा।
        */

        const isCorrect=
            question.a.includes(letter);

        showConclusion(
            conclusion,
            isCorrect,
            makeConclusion(
                question,
                qIndex,
                letter
            )
        );

    }

}

/* =====================================================
   CONCLUSION
===================================================== */

function showConclusion(
    el,
    isCorrect,
    text
){

    const card=
        el.closest(".question-card");

    card.querySelectorAll(".conclusion")
        .forEach(c=>{
            c.classList.remove(
                "show",
                "green",
                "red"
            );
        });

    el.innerHTML=
        `<b>${isCorrect ? "✓ सही:" : "✗ गलत:"}</b> ${text}`;

    el.classList.add("show");

    if(isCorrect){
        el.classList.add("green");
    }else{
        el.classList.add("red");
    }

}

/* =====================================================
   VIBRATION
===================================================== */

function vibrateOnce(){

    if(navigator.vibrate){

        navigator.vibrate(500);

    }

}

/* =====================================================
   AUDIO
===================================================== */

let audioCtx=null;

function getAudio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }

    return audioCtx;
}

/* Correct sound */

function correctSound(){

    const ctx=getAudio();

    const osc=ctx.createOscillator();

    const gain=ctx.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(
        600,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        1100,
        ctx.currentTime+0.28
    );

    gain.gain.setValueAtTime(
        0.0001,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.20,
        ctx.currentTime+0.03
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime+0.45
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime+0.5
    );

}

/* Celebration sound */

function celebrationSound(){

    const ctx=getAudio();

    const notes=[
        523,
        659,
        784,
        1046,
        1318
    ];

    notes.forEach((freq,i)=>{

        const osc=
            ctx.createOscillator();

        const gain=
            ctx.createGain();

        osc.type="triangle";

        osc.frequency.value=freq;

        const start=
            ctx.currentTime+i*.12;

        gain.gain.setValueAtTime(
            0.0001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            .16,
            start+.03
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            start+.30
        );

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start(start);

        osc.stop(start+.34);

    });

}

/* Low score sound */

function sadSound(){

    const ctx=getAudio();

    const osc=
        ctx.createOscillator();

    const gain=
        ctx.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(
        380,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        130,
        ctx.currentTime+.8
    );

    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .16,
        ctx.currentTime+.05
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime+.9
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
        ctx.currentTime+1
    );

}

/* =====================================================
   FLOWER
===================================================== */

function flowerBurst(button){

    const rect=
        button.getBoundingClientRect();

    const startX=
        rect.left+
        rect.width/2;

    const startY=
        rect.top+
        rect.height/2;

    const total=24;

    for(let i=0;i<total;i++){

        setTimeout(()=>{

            createPetal(
                startX,
                startY
            );

        },i*55);

    }

}

function createPetal(x,y){

    const petal=
        document.createElement("span");

    petal.className="petal";

    const symbols=[
        "🌸",
        "🌺",
        "✿",
        "❀"
    ];

    petal.textContent=
        symbols[
            Math.floor(
                Math.random()*
                symbols.length
            )
        ];

    petal.style.fontSize=
        (20+Math.random()*14)+"px";

    petal.style.left=x+"px";

    petal.style.top=y+"px";

    const direction=
        Math.random()<.5 ? -1 : 1;

    const x1=
        direction*
        (20+Math.random()*60)+"px";

    const y1=
        -(60+Math.random()*80)+"px";

    const x2=
        direction*
        (70+Math.random()*150)+"px";

    const y2=
        -(90+Math.random()*130)+"px";

    const x3=
        direction*
        (120+Math.random()*230)+"px";

    const y3=
        -(30+Math.random()*100)+"px";

    const x4=
        direction*
        (180+Math.random()*330)+"px";

    const y4=
        (20+Math.random()*220)+"px";

    petal.style.setProperty(
        "--x1",x1
    );

    petal.style.setProperty(
        "--y1",y1
    );

    petal.style.setProperty(
        "--x2",x2
    );

    petal.style.setProperty(
        "--y2",y2
    );

    petal.style.setProperty(
        "--x3",x3
    );

    petal.style.setProperty(
        "--y3",y3
    );

    petal.style.setProperty(
        "--x4",x4
    );

    petal.style.setProperty(
        "--y4",y4
    );

    document
        .getElementById("flowerLayer")
        .appendChild(petal);

    setTimeout(()=>{
        petal.remove();
    },2500);

}

/* =====================================================
   SUBMIT
===================================================== */

let submitted=false;

function submitQuiz(){

    if(submitted){

        document
        .getElementById("result")
        .scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

        return;
    }

    submitted=true;

    let correct=0;

    let wrong=0;

    let attempted=0;

    let skipped=0;

    questions.forEach(
        (question,index)=>{

            const state=states[index];

            if(state.locked){

                attempted++;

                if(
                    question.a.includes(
                        state.selected
                    )
                ){

                    correct++;

                }else{

                    wrong++;

                }

            }else{

                skipped++;

            }

        }
    );

    const total=
        questions.length;

    const percentage=
        ((correct/total)*100)
        .toFixed(2);

    document
    .getElementById("correctCount")
    .textContent=correct;

    document
    .getElementById("wrongCount")
    .textContent=wrong;

    document
    .getElementById("score")
    .textContent=
        correct+" / "+total;

    document
    .getElementById("percentage")
    .textContent=
        percentage+"%";

    document
    .getElementById("attemptedCount")
    .textContent=
        attempted;

    document
    .getElementById("skippedCount")
    .textContent=
        skipped;

    document
    .getElementById("result")
    .style.display="block";

    /*
       Skipped questions को अलग रंग
    */

    questions.forEach(
        (question,index)=>{

            const card=
                document.querySelector(
                    `.question-card[data-index="${index}"]`
                );

            if(!states[index].locked){

                card.style.borderColor=
                    "#ef6c00";

                card.style.borderLeftColor=
                    "#ef6c00";

            }

        }
    );

    document
    .getElementById("result")
    .scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

    if(percentage>=70){

        celebrationSound();

        for(let i=0;i<5;i++){

            setTimeout(()=>{

                const fake={

                    getBoundingClientRect:()=>({

                        left:
                        100+
                        Math.random()*
                        (window.innerWidth-200),

                        top:
                        150+
                        Math.random()*400,

                        width:80,

                        height:40

                    })

                };

                flowerBurst(fake);

            },i*250);

        }

    }else{

        sadSound();

    }

}
