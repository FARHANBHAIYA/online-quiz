<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CLASS IXTH BIOLOGY</title>

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    margin:0;
    background:#e9eef5;
    font-family:Arial,sans-serif;
}

#pdfContent{
    background:white;
    width:210mm;
    min-height:297mm;
    margin:auto;
    padding:10mm;
}

.download-btn{
    position:fixed;
    top:15px;
    right:15px;
    padding:12px 18px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    z-index:9999;
}

.download-btn:active{
    transform:scale(.96);
}

/* PDF बनाते समय button छिप जाएगा */
.pdf-mode .download-btn{
    display:none;
}

@media print{
    .download-btn{
        display:none;
    }

    body{
        background:white;
    }

    #pdfContent{
        margin:0;
    }
}
</style>
</head>

<body>

<button class="download-btn" onclick="downloadPDF()">
    📥 PDF Download
</button>

<!-- =========================
     आपका पूरा QUESTION PAPER
     इस DIV के अंदर रखें
========================= -->

<div id="pdfContent">

    <!-- यहाँ अपना पूरा पुराना HTML CONTENT रखें -->

    <h2 style="text-align:center;">CLASS IXTH BIOLOGY</h2>

    <!-- आपका बाकी question paper यहाँ रहेगा -->

</div>

<script>
function downloadPDF(){

    const element = document.getElementById("pdfContent");

    document.body.classList.add("pdf-mode");

    const options = {
        margin: 0,
        filename: "CLASS_IXTH_BIOLOGY.pdf",

        image: {
            type: "jpeg",
            quality: 0.98
        },

        html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
        },

        jsPDF: {
            unit: "mm",
            format: "a4",
            orientation: "portrait"
        },

        pagebreak: {
            mode: ["css", "legacy"]
        }
    };

    html2pdf()
        .set(options)
        .from(element)
        .save()
        .then(function(){
            document.body.classList.remove("pdf-mode");
        });
}
</script>

</body>
</html>
